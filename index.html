<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Free Fire – Painel de Sensibilidade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="panel">
  <h1>🔥 Free Fire Sens Panel</h1>

  <!-- MARCA -->
  <label>Marca do Celular</label>
  <select id="marca">
    <option>Samsung</option>
    <option>Xiaomi</option>
    <option>Redmi</option>
    <option>Poco</option>
    <option>Motorola</option>
    <option>Realme</option>
    <option>Oppo</option>
    <option>Vivo</option>
    <option>Asus</option>
    <option>Huawei</option>
    <option>Infinix</option>
    <option>Tecno</option>
    <option>iPhone</option>
    <option>Outro</option>
  </select>

  <!-- UPLOADS -->
  <label>📸 Foto do Boneco (Treino)</label>
  <input type="file" accept="image/*" id="foto">

  <label>🎥 Vídeo Sensibilidade Antiga</label>
  <input type="file" accept="video/*" id="video">

  <!-- SENS ANTIGA -->
  <h2>Sensibilidade Antiga</h2>

  <div class="range">
    Geral <span id="gOld">100</span>
    <input type="range" min="0" max="200" value="100" id="geralOld">
  </div>

  <div class="range">
    Red Dot <span id="rOld">100</span>
    <input type="range" min="0" max="200" value="100" id="redOld">
  </div>

  <!-- AIM ASSIST VISUAL -->
  <h2>🎯 Aim Assist (Treino)</h2>

  <label class="switch">
    <input type="checkbox" id="aimAssistOn">
    <span class="slider"></span>
  </label>

  <select id="assistPower">
    <option value="0.1">10%</option>
    <option value="0.5">50%</option>
    <option value="0.8">80%</option>
    <option value="1">100%</option>
  </select>

  <!-- AIM FOV -->
  <h2>⭕ Aim FOV (Visual)</h2>
  <input type="range" min="50" max="300" value="150" id="fovRange">

  <div id="arena">
    <div id="fov"></div>
    <div id="target"></div>
  </div>

  <button onclick="gerar()">GERAR NOVA SENS</button>

  <textarea id="resultado" readonly></textarea>
</div>

<script src="script.js"></script>
</body>
</html>
